[ChatMonitor]
; Enable or disable the feature entirely. 1=enabled, 0=disabled.
Enabled=1

; Enable or disable chat monitor sounds (unread + PWA closed notifications). 1=enabled, 0=disabled.
SoundEnabled=1

; How often to scan for apps, in seconds.
CheckIntervalSeconds=5

; PrefixMask-style filter file that controls which matched chat entries are reviewed.
; If empty or file is missing, no entries are reviewed.
ReviewMaskFile=ChatReviewMask.txt

; Sound to play for new unread messages. Can be a relative or full path.
UnreadMessageSound=assets\wav\Message.wav

; Minimum time in seconds between playing the unread message sound.
UnreadMessageSoundIntervalSeconds=30

; Sound to play when a monitored PWA (Edge) window is closed.
PwaClosedSound=assets\wav\alerte.wav

[WindowTitlePolling]
; How often to refresh terminal window titles in the Console list, in seconds. 0=disabled.
RefreshIntervalSeconds=5

[FocusSound]
; WAV file to play when ActiveAppView gains focus. Relative paths start from the executable directory.
; Leave blank to disable. Missing files are ignored without a fallback beep.
File=assets\wav\focus2.wav

[save-renames-to-journal]
; Write successful Rename actions to the existing Shadow Journal database. 1=enabled, 0=disabled.
enabled=1

; Exact database filename. ActiveAppView never creates or migrates this database.
db-file=F:\projects\MaxLogic\PawelsPersonalShadowJourney\data\shadow_journal.db

[MachineOverview]
Enabled=1
DisplayRefreshIntervalMs=10000
PanelWidth=420
SystemSampleIntervalMs=1000
ProcessSampleIntervalMs=2000
TemperatureSampleIntervalMs=3000
HistoryCommitIntervalMs=10000
HistoryEnabled=1
RawRetentionHours=48
Rollup10sRetentionDays=30
Rollup1mRetentionDays=365
MaxDatabaseSizeMB=2048
DetailedTraceEnabled=0
